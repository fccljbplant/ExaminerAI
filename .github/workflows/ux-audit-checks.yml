name: UX audit checks

on:
  push:
    branches:
      - main
      - "ux-audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-not-for-production
      ADMIN_EMAIL: ci-admin@example.invalid
      ADMIN_PASSWORD: ci-only-not-for-production
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Initialize isolated test database
        run: npx prisma db push --skip-generate
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Smoke-test every app page route
        run: node scripts/smoke-app-routes.mjs
      - name: Capture authenticated role screenshots
        run: node scripts/capture-role-screenshots.mjs
      - name: Upload role screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-dashboard-screenshots
          path: artifacts/role-screenshots/
          if-no-files-found: warn
          retention-days: 7
